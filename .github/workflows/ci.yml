name: EquityLens validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - run: pip install -r backend/requirements-dev.lock
      - run: python -m pytest --cov=app --cov-report=term-missing
        working-directory: backend
        env:
          EQUITYLENS_BACKGROUND_REFRESH: "false"
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: equitylens
          POSTGRES_DB: equitylens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U equitylens"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-dev.lock
      - run: python -m pytest tests/test_postgres.py
        working-directory: backend
        env:
          EQUITYLENS_TEST_POSTGRES_URL: postgresql+psycopg://equitylens:test-only@localhost:5432/equitylens
