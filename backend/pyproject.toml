[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equitylens"
version = "1.0.0"
description = "Transparent personal equity research and conditional risk planning"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "pydantic-settings>=2.6,<3",
  "yfinance>=0.2.65,<2", "pandas>=2.2,<4", "numpy>=2,<3",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1",
  "defusedxml>=0.7,<1", "python-dateutil>=2.9,<3"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
